[package]
name = "motioncore-cli"
description = "motioncore: headless engine, control client, simulator and firmware tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "motioncore"
path = "src/main.rs"

[dependencies]
motioncore-core = { workspace = true }
motioncore-engine-api = { workspace = true }
motioncore-device-graph = { workspace = true }
motioncore-plugin-runtime = { workspace = true }
motioncore-builtin-plugins = { workspace = true }
motioncore-simulator = { workspace = true }
motioncore-firmware-builder = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
