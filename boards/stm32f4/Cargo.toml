[package]
name = "motioncore-board-stm32f4"
description = "MotionCore firmware for STM32F411 (WeAct Black Pill) — provisional MVP board"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cross-compiled only:
#   cargo build -p motioncore-board-stm32f4 --profile firmware --target thumbv7em-none-eabihf
[[bin]]
name = "motioncore-board-stm32f4"
path = "src/main.rs"
test = false
bench = false

[features]
# Bench test builds, made with `motioncore firmware build --bench <feature>`.
# Never enable them in production firmware. Both use PB1: one at a time.
#
# Panic safe state: PB1 tied to GND makes the firmware panic in the next
# motion tick.
bench-panic = []
# Tick-interrupt timing: PB1 is high while the motion tick interrupt runs,
# for a logic analyser.
bench-isr-probe = []

[dependencies]
motioncore-firmware-core = { workspace = true }
motioncore-protocol = { workspace = true }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
critical-section = "1"
stm32f4xx-hal = { version = "0.22", features = ["stm32f411", "usb_fs"] }
usb-device = "0.3"
usbd-serial = "0.2"
